schemaVersion = 1
id = "org.7-zip.7-zip"
version = "26.02"
name = "7-Zip"
summary = "A pinned silent installation of the open-source 7-Zip file archiver."
homepage = "https://www.7-zip.org/"

[license]
spdx = "LicenseRef-7-Zip"
noticeUrl = "https://www.7-zip.org/license.txt"
acceptance = "none"

[application]
executable = "C:\\Program Files\\7-Zip\\7zFM.exe"
arguments = []
workingDirectory = "C:\\Program Files\\7-Zip"

[runtimeAccess]
network = "none"
folders = ["documents", "downloads"]

[[variants]]
platform = "linux"
hostArchitecture = "x86_64"
translation = "native"

[variants.engine]
family = "wine"
version = ">=10,<11"
features = ["win64"]

[[variants]]
platform = "macos"
hostArchitecture = "aarch64"
translation = "rosetta2"

[variants.engine]
family = "winecx"
version = ">=24,<26"
features = ["win64"]

[[sources]]
id = "installer"
kind = "remote"
url = "https://www.7-zip.org/a/7z2602-x64.exe"
sha256 = "6745fa76dc2ea031596d8678f6f6b99c3c1b435b4164a63485adbbc7b8d82ef0"

[[install]]
action = "run-installer"
source = "installer"
installerType = "exe"
arguments = ["/S"]
successExitCodes = [0]

[[verify]]
check = "file-exists"
path = "C:\\Program Files\\7-Zip\\7zFM.exe"
